[project]
name = "billion-rows-challenge"
version = "0.1.0"
description = "Benchmarking data processing tools on 1 billion rows"
authors = [
    { name = "Joseph Cavarretta", email = "joseph.m.cavarretta@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "vortex-data>=0.84.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.16.3",
]

[tool.ruff]
extend = "../agent-dev-harness/python-styleguide/ruff-base.toml"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
strict = true
# Same loose paths as the lint baseline: scripts/ and .local/ are not checked.
exclude = ['(^|/)scripts/', '(^|/)\.local/']
